## Validation Checklist

Before merging this contract:
- [ ] `.releaserc.json` exists in repository root
- [ ] Dependencies installed (`semantic-release`, `@semantic-release/changelog`, `@semantic-release/git`)
- [ ] Branch protection on `main` requires CI to pass
- [ ] Workflow has `contents: write` permission
- [ ] Commit message includes `[skip ci]`
- [ ] npm publish disabled (`npmPublish: false`)

