## Permissions

**Required Permissions**:
- `contents: write` - Create tags, push commits, create releases
- `issues: write` - Comment on resolved issues
- `pull-requests: write` - Comment on merged PRs

**Token**: `GITHUB_TOKEN` (automatically provided by GitHub Actions)
- Sufficient for all operations
- No PAT (Personal Access Token) required

---

## Release Process Flow

```mermaid
graph TD
    A[Push to main] --> B{CI Passed?}
    B -->|No| C[Stop - No Release]
    B -->|Yes| D[Checkout full history]
    D --> E[Analyze commits]
    E --> F{Relevant changes?}
    F -->|No| G[Log: No release needed]
    F -->|Yes| H[Determine version bump]
    H --> I[Update package.json]
    I --> J[Update CHANGELOG.md]
    J --> K[Commit changes]
    K --> L[Create git tag]
    L --> M[Push to main]
    M --> N[Create GitHub Release]
    N --> O[✅ Release Complete]
```

---

## Outputs

### Git Commit
- **Author**: semantic-release-bot
- **Message**: `chore(release): X.Y.Z [skip ci]`
- **Files**: `package.json`, `CHANGELOG.md`

### Git Tag
- **Format**: `vX.Y.Z` (e.g., `v1.2.3`)
- **Annotation**: Release notes

### GitHub Release
- **Title**: `vX.Y.Z`
- **Body**: Generated release notes
- **Assets**: None (template project)

