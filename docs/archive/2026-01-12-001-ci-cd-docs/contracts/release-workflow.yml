## Conventional Commits

### Release Types

| Commit Message Prefix | Release Type | Example Version Bump |
|-----------------------|--------------|----------------------|
| `fix:` | Patch | 1.0.0 → 1.0.1 |
| `feat:` | Minor | 1.0.1 → 1.1.0 |
| `feat!:` or `BREAKING CHANGE:` | Major | 1.1.0 → 2.0.0 |
| `chore:`, `docs:`, `style:`, etc. | None | No release |

### Valid Prefixes
- `feat`: New feature
- `fix`: Bug fix
- `docs`: Documentation only
- `style`: Code style (formatting, no logic change)
- `refactor`: Code refactoring
- `perf`: Performance improvement
- `test`: Adding tests
- `chore`: Maintenance (deps, config, etc.)

### Examples

**Patch Release**:
```
fix: resolve null pointer exception in greet function
```

**Minor Release**:
```
feat: add support for custom greeting messages
```

**Major Release** (Option 1):
```
feat!: change greet function signature

BREAKING CHANGE: greet() now requires name parameter
```

**Major Release** (Option 2):
```
feat: redesign API

BREAKING CHANGE: All functions now return Promises
```

**No Release**:
```
chore: update devcontainer configuration
docs: fix typo in README
```

