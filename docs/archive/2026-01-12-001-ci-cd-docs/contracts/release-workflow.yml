## Semantic-Release Configuration

**File**: `.releaserc.json` (repository root)

```json
{
  "branches": ["main"],
  "plugins": [
    "@semantic-release/commit-analyzer",
    "@semantic-release/release-notes-generator",
    "@semantic-release/changelog",
    ["@semantic-release/npm", {
      "npmPublish": false
    }],
    "@semantic-release/github",
    ["@semantic-release/git", {
      "assets": ["package.json", "CHANGELOG.md"],
      "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
    }]
  ]
}
```

### Plugin Responsibilities

1. **@semantic-release/commit-analyzer**
   - Reads commits since last release
   - Determines release type: major, minor, patch, or none
   - Based on: Conventional Commits (feat, fix, BREAKING CHANGE)

2. **@semantic-release/release-notes-generator**
   - Generates release notes from commits
   - Groups by type (Features, Bug Fixes, etc.)
   - Includes commit links

3. **@semantic-release/changelog**
   - Updates `CHANGELOG.md` with new release
   - Appends to top of file
   - Preserves existing entries

4. **@semantic-release/npm**
   - Updates `version` in package.json
   - Skips npm registry publish (`npmPublish: false`)

5. **@semantic-release/github**
   - Creates GitHub Release
   - Attaches release notes
   - Links to commits and PRs

6. **@semantic-release/git**
   - Commits `package.json` and `CHANGELOG.md` changes
   - Tags commit with version
   - Pushes to origin/main
   - Commit message includes `[skip ci]` to avoid triggering CI

