## Edge Cases Handled

### 1. No Relevant Commits
- **Scenario**: Only `chore:` or `docs:` commits since last release
- **Behavior**: semantic-release logs "no release" and exits successfully
- **Result**: No new version, no GitHub Release

### 2. Multiple Commits
- **Scenario**: Several commits pushed together
- **Behavior**: semantic-release aggregates all commits
- **Result**: Single release with all changes

### 3. BREAKING CHANGE in Body
- **Scenario**: Breaking change in commit body, not footer
```
feat: improve API

BREAKING CHANGE: removed deprecated method
```
- **Behavior**: Correctly identified as major release

### 4. First Release
- **Scenario**: No previous tags exist
- **Behavior**: Creates v1.0.0 (if feat commits exist)

### 5. Release Commit Triggers CI
- **Scenario**: Commit from semantic-release-bot
- **Behavior**: `[skip ci]` in message prevents CI run
- **Rationale**: Already verified by previous CI run

