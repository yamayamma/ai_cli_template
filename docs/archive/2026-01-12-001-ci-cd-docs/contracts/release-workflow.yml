## Testing Strategy

### Dry Run (Local)
```bash
# Test semantic-release without actually releasing
npx semantic-release --dry-run --no-ci
```

### Test Commit Analysis
```bash
# Verify commit triggers release
git commit -m "feat: test feature"
npx semantic-release --dry-run --no-ci
# Expected: "The next release version is 1.1.0"
```

