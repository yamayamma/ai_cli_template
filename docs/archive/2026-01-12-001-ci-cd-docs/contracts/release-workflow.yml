## Performance Targets

| Step | Target Time | Typical Time |
|------|-------------|--------------|
| Checkout (full history) | < 10s | ~5s |
| Install dependencies | < 30s | ~15s (cache hit) |
| Build verification | < 30s | ~20s |
| semantic-release | < 60s | ~30s |

**Total**: < 2 minutes

