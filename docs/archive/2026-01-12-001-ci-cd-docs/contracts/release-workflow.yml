# Release Workflow Contract

**Purpose**: Define the exact structure and behavior of the semantic-release workflow  
**File Location**: `.github/workflows/release.yml`  
**Triggers**: Push to `main` branch (after CI passes)

## Workflow Structure

```yaml
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write  # Create tags and releases
  issues: write    # Comment on issues
  pull-requests: write  # Comment on PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run if CI passes (implied by branch protection)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for semantic-release
          persist-credentials: false  # Use PAT instead
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Verify build
        run: pnpm build
        
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@martynus.net
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@martynus.net
        run: npx semantic-release
```

## Job Specification

### Job: `release`
**Purpose**: Analyze commits, determine version bump, create release  
**Runner**: ubuntu-latest  
**Node Version**: 22  
**Timeout**: Default (typically completes in < 2 minutes)

**Steps**:
1. **Checkout code**
   - Full history (`fetch-depth: 0`) required for commit analysis
   - Use default credentials (GITHUB_TOKEN has sufficient permissions)

2. **Setup pnpm** (version 9)

3. **Setup Node.js** with pnpm cache

4. **Install dependencies** (frozen lockfile)

5. **Verify build**
   - Ensures project builds before creating release
   - Prevents releasing broken code

6. **Run semantic-release**
   - Analyzes commits since last release
   - Determines version bump (major/minor/patch)
   - Updates package.json and CHANGELOG.md
   - Commits changes back to repo
   - Creates git tag
   - Creates GitHub Release

**Exit Conditions**:
- ✅ Success: New release created (or "no release" if no relevant commits)
- ❌ Failure: Build fails, commit analysis fails, or GitHub API error

