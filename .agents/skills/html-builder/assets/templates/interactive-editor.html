<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Editor title]</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel-2:#21262d; --text:#e6edf3; --muted:#8b949e; --border:#30363d; --accent:#2f81f7; --success:#3fb950; --danger:#f85149; --warning:#d29922; --sans:system-ui,-apple-system,Segoe UI,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  .wrap { max-width:1220px; margin:0 auto; padding:28px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:18px; }
  h1 { font-size:30px; line-height:1.1; margin:0; }
  button { border:1.5px solid var(--accent); background:var(--accent); color:white; border-radius:7px; padding:9px 12px; font-weight:700; cursor:pointer; }
  .app { display:grid; grid-template-columns:260px minmax(0,1fr) 340px; gap:14px; min-height:640px; }
  .panel { background:var(--panel); border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
  .panel-head { padding:12px 14px; border-bottom:1px solid var(--border); font:700 12px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .list { padding:10px; display:grid; gap:8px; }
  .item { border:1px solid var(--border); background:var(--panel-2); border-radius:7px; padding:10px; cursor:pointer; }
  .item.active { border-color:var(--accent); background:#0f2745; }
  textarea { width:100%; min-height:560px; border:0; resize:none; padding:14px; font:14px/1.5 var(--mono); outline:none; background:var(--panel); color:var(--text); }
  .preview { padding:14px; color:var(--muted); }
  .status { display:inline-flex; border-radius:999px; padding:4px 8px; background:var(--panel-2); border:1px solid var(--border); font-size:12px; color:var(--muted); }
  @media (max-width:980px) { .app { grid-template-columns:1fr; } textarea { min-height:320px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="status">[workflow]</div>
      <h1>[Editable artifact name]</h1>
    </div>
    <button id="copyBtn">Copy</button>
  </header>
  <main class="app">
    <aside class="panel">
      <div class="panel-head">Items</div>
      <div class="list" id="list"></div>
    </aside>
    <section class="panel">
      <div class="panel-head">Editor</div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>
    <aside class="panel">
      <div class="panel-head">Preview</div>
      <div class="preview" id="preview"></div>
    </aside>
  </main>
</div>
<script>
const ITEMS = [
  { name: "Sample A", text: "Replace this with realistic structured content." },
  { name: "Sample B", text: "Use domain-specific sample data, not lorem ipsum." }
];
const list = document.getElementById("list");
const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
let active = 0;

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function render() {
  list.innerHTML = ITEMS.map((item, i) => `<div class="item ${i === active ? "active" : ""}" data-i="${i}">${escapeHtml(item.name)}</div>`).join("");
  editor.value = ITEMS[active].text;
  preview.innerHTML = `<pre>${escapeHtml(ITEMS[active].text)}</pre>`;
}
list.addEventListener("click", event => {
  const item = event.target.closest(".item");
  if (!item) return;
  active = Number(item.dataset.i);
  render();
});
editor.addEventListener("input", () => {
  ITEMS[active].text = editor.value;
  preview.innerHTML = `<pre>${escapeHtml(editor.value)}</pre>`;
});
document.getElementById("copyBtn").addEventListener("click", () => navigator.clipboard && navigator.clipboard.writeText(editor.value));
render();
</script>
</body>
</html>
