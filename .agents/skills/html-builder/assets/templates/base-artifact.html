<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Artifact title]</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #21262d;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --accent: #2f81f7;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 28px 96px; }
  .eyebrow {
    font: 700 12px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(36px, 5vw, 60px);
    line-height: 1.05;
    margin: 0;
    max-width: 16ch;
  }
  .lead { max-width: 680px; color: var(--muted); font-size: 17px; margin: 20px 0 0; }
  main { margin-top: 44px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">[Category] / [Context]</div>
    <h1>[Specific artifact title]</h1>
    <p class="lead">[One or two sentences that frame the artifact and decision.]</p>
  </header>
  <main>
    <!-- Replace with the artifact-specific structure. -->
  </main>
</div>
</body>
</html>
